name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack and Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Install Dependencies
        run: |
          yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Build Server and Frontend on Host
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" npx nx run twenty-server:lingui:extract
          NODE_OPTIONS="--max-old-space-size=4096" npx nx run twenty-server:lingui:compile
          NODE_OPTIONS="--max-old-space-size=4096" npx nx run twenty-emails:lingui:extract
          NODE_OPTIONS="--max-old-space-size=4096" npx nx run twenty-emails:lingui:compile
          NODE_OPTIONS="--max-old-space-size=4096" npx nx run twenty-server:build
          NODE_OPTIONS="--max-old-space-size=4096" npx nx build twenty-front

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/twenty-docker/twenty/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/crm-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
